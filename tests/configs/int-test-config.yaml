# INT SMTS Test Configuration
deployment:
  type: "int"
  name: "smts-int-test"
  environment: "test"

nats:
  embedded: true
  host: "localhost"
  port: 14223  # Different port from EXT test
  stream:
    name: "SMTS_INT_TEST"
    subjects: ["test.monterra.>", "test.pact_update.>"]
    retention: "workqueue"
    max_age: "1h"
    storage: "memory"  # Use memory for faster tests
    replicas: 1
  consumer:
    durable_name: "SMTS_INT_TEST_CONSUMER"
    ack_policy: "explicit"
    deliver_policy: "all"

api:
  base_url: "http://localhost:18082"  # Different port from EXT test
  timeout: "10s"
  retry:
    max_attempts: 2
    backoff: "1s"
  auth:
    type: "api_key"
    api_key: "test-api-key"

dlp:
  enabled: true
  endpoint: "http://localhost:18082/validate"
  timeout: "5s"
  retry:
    max_attempts: 1
    backoff: "1s"

artemis:
  enabled: true
  host: "localhost"
  port: 16162  # Different port from EXT test
  queue: "SMTS_INT_TEST_QUEUE"
  username: "test"
  password: "test"

logging:
  level: "debug"
  format: "console"
  output: "stdout"

health:
  port: 18083  # Different port to avoid conflicts
  path: "/health"
  interval: "10s"

# Test topics configuration
topics:
  topics:
    test.monterra.event:
      topic: "test.monterra.event"
      read_roles: ["int_reader"]
      write_roles: ["int_writer"]
      description: "Test monterra events"
    
    test.pact_update.event:
      topic: "test.pact_update.event"
      read_roles: ["int_reader"]
      write_roles: ["int_writer"]
      description: "Test pact update events"
  
  roles:
    int_reader:
      name: "int_reader"
      description: "INT network message reader"
      topics: ["test.monterra.event", "test.pact_update.event"]
    
    int_writer:
      name: "int_writer"
      description: "INT network message writer"
      topics: ["test.monterra.event", "test.pact_update.event"]