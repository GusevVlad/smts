# EXT SMTS Test Configuration
deployment:
  type: "ext"
  name: "smts-ext-test"
  environment: "test"

nats:
  embedded: true
  host: "0.0.0.0"  # Bind to all interfaces for Docker compatibility
  port: 14222  # Different port to avoid conflicts
  # Client stream for messages from local clients (Flow 1)
  client_stream:
    name: "SMTS_EXT_CLIENT"
    subjects: ["test.monterra.>", "test.pact_update.>", "signature"]
    retention: "workqueue"
    max_age: "1h"
    storage: "memory"  # Use memory for faster tests
    replicas: 1
  client_consumer:
    durable_name: "SMTS_EXT_CLIENT_CONSUMER"
    ack_policy: "explicit"
    deliver_policy: "all"
  # External stream for messages from different network instances (Flow 2)
  external_stream:
    name: "SMTS_EXT_EXTERNAL"
    subjects: ["external.test.monterra.>", "external.test.pact_update.>", "external.signature"]
    retention: "workqueue"
    max_age: "1h"
    storage: "memory"
    replicas: 1
  external_consumer:
    durable_name: "SMTS_EXT_EXTERNAL_CONSUMER"
    ack_policy: "explicit"
    deliver_policy: "all"

api:
  base_url: "http://corporate-api:8080"  # Corporate API service
  timeout: "10s"
  retry:
    max_attempts: 2
    backoff: "1s"
  auth:
    type: "client_credentials"  # Options: "api_key", "client_credentials"
    api_key: "test-api-key"  # Used when type is "api_key"
    client_id: "test-client-id"  # Used when type is "client_credentials"
    client_secret: "test-client-secret"  # Used when type is "client_credentials"
    token_url: "http://corporate-api:8080/oauth/token"  # Used when type is "client_credentials"
    scopes: "api"  # Optional scopes for client credentials

dlp:
  enabled: false
  endpoint: "http://dlp-mock:1080/validate"
  timeout: "5s"
  retry:
    max_attempts: 1
    backoff: "1s"
  provider: "legacy"  # Options: "legacy", "traffic_monitor"
  traffic_monitor:
    base_url: ""  # e.g., "https://server.company.ru:9106"
    auth_token: ""
    company_id: ""
    version: "1.8"
    capture_server_ip: ""
    capture_server_fqdn: ""
    verdict_polling_enabled: false
    verdict_polling_interval: "5s"
    verdict_polling_timeout: "30s"

logging:
  level: "debug"
  format: "console"
  output: "stdout"

health:
  port: 18081  # Different port to avoid conflicts
  path: "/health"
  interval: "10s"

# Test topics configuration
topics:
  test.monterra.event:
    description: "Test monterra events"
  
  test.pact_update.event:
    description: "Test pact update events"

  signature:
    description: "Signature events"

# LDAP configuration for testing (enabled for test environment)
ldap:
  enabled: true
  host: "ldap-mock"
  port: 1389
  base: "dc=test,dc=com"
  bind_dn: "cn=admin,dc=test,dc=com"
  bind_password: "adminpass"
  user_filter: "(uid=%s)"
  group_filter: "(member=%s)"
  attributes:
    - "uid"
    - "cn"
    - "mail"
    - "displayName"
    - "distinguishedName"
    - "memberOf"
  server_name: ""
  use_ssl: false
  skip_tls: false
  insecure_skip_verify: true
  use_http: true

# Vault configuration for testing
vault:
  enabled: true
  address: "http://vault-test:8200"
  role_id: ""
  secret_id: ""
  path_prefix: "smts"
  auto_renew: false
  renewal_threshold: "5m"