# INT SMTS Configuration
deployment:
  type: "int"
  name: "smts-int-prod"
  environment: "production"

nats:
  embedded: true
  host: "localhost"
  port: 4222
  stream:
    name: "SMTS_INT"
    subjects: ["monterra.>", "pact_update.>"]
    retention: "workqueue"
    max_age: "24h"
    storage: "file"
    replicas: 1
  consumer:
    durable_name: "SMTS_INT_CONSUMER"
    ack_policy: "explicit"
    deliver_policy: "all"

api:
  base_url: "https://api.corporate.com"
  timeout: "30s"
  retry:
    max_attempts: 3
    backoff: "2s"
  auth:
    type: "api_key"
    api_key: "${API_KEY}"

dlp:
  enabled: true
  endpoint: "https://dlp.corporate.com/validate"
  timeout: "10s"
  retry:
    max_attempts: 2
    backoff: "1s"
  provider: "legacy"  # Options: "legacy", "traffic_monitor"
  traffic_monitor:
    base_url: ""  # e.g., "https://server.company.ru:9106"
    auth_token: "${TRAFFIC_MONITOR_AUTH_TOKEN}"
    company_id: "${TRAFFIC_MONITOR_COMPANY_ID}"
    version: "1.8"
    capture_server_ip: ""
    capture_server_fqdn: ""
    verdict_polling_enabled: false
    verdict_polling_interval: "5s"
    verdict_polling_timeout: "30s"

artemis:
  enabled: true
  host: "artemis"
  port: 61613
  queue: "SMTS_INT_QUEUE"
  username: "${ARTEMIS_USER}"
  password: "${ARTEMIS_PASSWORD}"

logging:
  level: "info"
  format: "json"
  output: "stdout"

health:
  port: 8080
  path: "/health"
  interval: "30s"

# LDAP configuration for authentication and authorization
ldap:
  enabled: false
  host: "ldap.example.com"
  port: 389
  base: "dc=example,dc=com"
  bind_dn: "cn=admin,dc=example,dc=com"
  bind_password: "${LDAP_BIND_PASSWORD}"
  user_filter: "(uid=%s)"
  group_filter: "(member=%s)"
  attributes:
    - "uid"
    - "cn"
    - "mail"
    - "distinguishedName"
  server_name: ""
  use_ssl: false
  skip_tls: false
  insecure_skip_verify: false

# Vault Configuration
vault:
  enabled: true
  address: "${VAULT_ADDR:-http://vault:8200}"
  role_id: "${VAULT_ROLE_ID}"
  secret_id: "${VAULT_SECRET_ID}"
  path_prefix: "smts"
  auto_renew: true
  renewal_threshold: "5m"

# Topics configuration will be loaded from separate topics.yaml file