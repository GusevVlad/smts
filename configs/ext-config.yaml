# EXT SMTS Configuration
deployment:
  type: "ext"
  name: "smts-ext-prod"
  environment: "production"

nats:
  embedded: true
  host: "localhost"
  port: 4222
  stream:
    name: "SMTS_EXT"
    subjects: ["monterra.>", "pact_update.>"]
    retention: "workqueue"
    max_age: "24h"
    storage: "file"
    replicas: 1
  consumer:
    durable_name: "SMTS_EXT_CONSUMER"
    ack_policy: "explicit"
    deliver_policy: "all"

api:
  base_url: "https://api.corporate.com"
  timeout: "30s"
  retry:
    max_attempts: 3
    backoff: "2s"
  auth:
    type: "client_credentials"  # Options: "api_key", "client_credentials"
    api_key: "${API_KEY}"  # Used when type is "api_key"
    client_id: "${CLIENT_ID}"  # Used when type is "client_credentials"
    client_secret: "${CLIENT_SECRET}"  # Used when type is "client_credentials"
    token_url: "${TOKEN_URL}"  # Used when type is "client_credentials"
    scopes: "api"  # Optional scopes for client credentials

logging:
  level: "info"
  format: "json"
  output: "stdout"

health:
  port: 8080
  path: "/health"
  interval: "30s"

# LDAP configuration for authentication and authorization
ldap:
  enabled: false
  host: "ldap.example.com"
  port: 389
  base: "dc=example,dc=com"
  bind_dn: "cn=admin,dc=example,dc=com"
  bind_password: "${LDAP_BIND_PASSWORD}"
  user_filter: "(uid=%s)"
  group_filter: "(member=%s)"
  attributes:
    - "uid"
    - "cn"
    - "mail"
    - "distinguishedName"
  server_name: ""
  use_ssl: false
  skip_tls: false
  insecure_skip_verify: false

# Topics configuration will be loaded from separate topics.yaml file