version: '3.8'

services:
  # Test Artemis server for INT SMTS tests
  artemis-test:
    container_name: artemis-test
    image: apache/activemq-artemis:2.42.0
    ports:
      - "61613:61613"  # INT test port
      - "18161:8161"   # Web console
    volumes:
      - artemis-test-data:/var/lib/artemis/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8161/console"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Test API server for simulating corporate API
  api-mock:
    image: mockserver/mockserver:mockserver-5.15.0
    container_name: api-mock
    ports:
      - "18080:1080"  # EXT test API
      - "18082:1081"  # INT test API
    environment:
      - MOCKSERVER_LOG_LEVEL=INFO
      - MOCKSERVER_SERVER_PORT=1080,1081
    # MockServer containers are very minimal and don't have standard health check tools
    # Using a simple delay instead of health check

  # Test DLP service for INT SMTS tests
  dlp-mock:
    image: mockserver/mockserver:mockserver-5.15.0
    container_name: dlp-mock
    ports:
      - "18081:1080"  # DLP validation service
    environment:
      - MOCKSERVER_LOG_LEVEL=INFO
    command: >
      -serverPort 1080
    # MockServer containers are very minimal and don't have standard health check tools
    # Using a simple delay instead of health check

  smts-test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: test-runner
    container_name: smts-test-runner
    depends_on:
      artemis-test:
        condition: service_healthy
      api-mock:
        condition: service_started
      dlp-mock:
        condition: service_started
      smts-ext-test:
        condition: service_healthy
      smts-int-test:
        condition: service_healthy
    environment:
      - ARTEMIS_URL=tcp://artemis-test:61613
      - API_BASE_URL=http://api-mock:1080
      - DLP_ENDPOINT=http://dlp-mock:1080/validate
      - LOG_LEVEL=debug
      - LOG_PATH=/app/logs
    volumes:
      - ./test-results:/app/test-results
      - ./docker-logs/smts-test-runner:/app/logs
    command: >
      sh -c "
        echo 'Waiting for all services to be ready...' &&
        sleep 5 &&
        echo '=== Running Unit Tests ===' &&
        /app/bin/run-unit-tests.sh 2>&1 | tee /app/logs/unit-tests.log &&
        echo '=== Running Integration Tests ===' &&
        /app/bin/run-integration-tests.sh 2>&1 | tee /app/logs/integration-tests.log
      "

  # EXT SMTS test service
  smts-ext-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: smts-ext-test
    depends_on:
      api-mock:
        condition: service_started
    environment:
      - CONFIG_FILE=/app/tests/configs/ext-test-config.yaml
    command: >
      sh -c "
        /app/bin/ext-smts --config /app/tests/configs/ext-test-config.yaml
      "
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:18081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # INT SMTS test service
  smts-int-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: smts-int-test
    depends_on:
      artemis-test:
        condition: service_healthy
      api-mock:
        condition: service_started
      dlp-mock:
        condition: service_started
    environment:
      - CONFIG_FILE=/app/tests/configs/int-test-config.yaml
    command: >
      sh -c "
        /app/bin/int-smts --config /app/tests/configs/int-test-config.yaml
      "
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:18083/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  artemis-test-data: