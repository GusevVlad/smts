version: '3.8'

services:
  # Test Artemis server for INT SMTS tests
  artemis-test:
    container_name: artemis-test
    image: apache/activemq-artemis:2.42.0
    ports:
      - "61613:61613"  # INT test port
      - "18161:8161"   # Web console
    volumes:
      - artemis-test-data:/var/lib/artemis/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8161/console"]
      interval: 30s
      timeout: 10s
      retries: 3


  # Corporate API service for testing message flows
  corporate-api:
    build:
      context: .
      dockerfile: tests/mocks/corporate-api/Dockerfile
    container_name: corporate-api
    ports:
      - "18080:8080"  # Corporate API service
    environment:
      - ARTEMIS_URL=artemis-test:61613
      - EXT_SMTS_URL=http://smts-ext-test:18082
      - ARTEMIS_QUEUE=SMTS_INT_TEST_QUEUE
      - PORT=8080
    depends_on:
      artemis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Test DLP service for INT SMTS tests
  dlp-mock:
    image: mockserver/mockserver:mockserver-5.15.0
    container_name: dlp-mock
    ports:
      - "18081:1080"  # DLP validation service
    environment:
      - MOCKSERVER_LOG_LEVEL=INFO
      - MOCKSERVER_SERVER_PORT=1080
    # MockServer will start automatically with the environment variable

  # DLP MockServer initialization container
  dlp-mock-init:
    image: curlimages/curl:latest
    container_name: dlp-mock-init
    depends_on:
      dlp-mock:
        condition: service_started
    command: >
      sh -c "
        echo 'Waiting for DLP MockServer to be ready...' &&
        until curl -s http://dlp-mock:1080/status > /dev/null; do
          echo 'Waiting for DLP MockServer...'
          sleep 2
        done &&
        echo 'DLP MockServer is ready. Initializing expectations...' &&
        
        # Configure DLP Mock expectations
        echo 'Configuring DLP Mock expectations...' &&
        
        # Health check endpoint
        curl -X PUT -s http://dlp-mock:1080/expectation -d '{
          \"httpRequest\": {
            \"method\": \"GET\",
            \"path\": \"/health\"
          },
          \"httpResponse\": {
            \"statusCode\": 200,
            \"body\": \"OK\"
          }
        }' > /dev/null &&
        
        # DLP validation endpoint
        curl -X PUT -s http://dlp-mock:1080/expectation -d '{
          \"httpRequest\": {
            \"method\": \"POST\",
            \"path\": \"/validate\",
            \"headers\": {
              \"X-API-Key\": [\"test-api-key\"]
            }
          },
          \"httpResponse\": {
            \"statusCode\": 200,
            \"body\": \"{\\\"approved\\\": true, \\\"reasons\\\": []}\"
          }
        }' > /dev/null &&
        
        echo 'DLP MockServer expectations configured successfully!'
      "



  # LDAP Mock Server for testing
  ldap-mock:
    build:
      context: .
      dockerfile: tests/mocks/ldap-mock/Dockerfile
    container_name: ldap-mock
    ports:
      - "11389:1389"  # LDAP mock server port
    environment:
      - LDAP_MOCK_PORT=1389
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:1389/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # EXT SMTS test service
  smts-ext-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: smts-ext-test
    depends_on:
      corporate-api:
        condition: service_healthy
    ports:
      - "14222:14222"  # NATS server port for testing
      - "18091:18081"  # Health server port for testing
      - "18092:18082"  # HTTP server port for testing (send)
      - "19081:19081"  # Message API port for testing (receive)
    environment:
      - CONFIG_FILE=/app/tests/configs/ext-test-config.yaml
    command: >
      sh -c "
        /app/bin/ext-smts --config /app/tests/configs/ext-test-config.yaml
      "
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:18081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # INT SMTS test service
  smts-int-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: smts-int-test
    depends_on:
      artemis-test:
        condition: service_healthy
      corporate-api:
        condition: service_healthy
      dlp-mock:
        condition: service_started
    ports:
      - "14223:14223"  # NATS server port for testing
      - "18093:18083"  # Health server port for testing
      - "18094:18084"  # HTTP server port for testing (send)
      - "19083:19083"  # Message API port for testing (receive)
    environment:
      - CONFIG_FILE=/app/tests/configs/int-test-config.yaml
    command: >
      sh -c "
        /app/bin/int-smts --config /app/tests/configs/int-test-config.yaml
      "
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:18083/health"]
      interval: 10s
      timeout: 5s
      retries: 5


  smts-test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: test-runner
    container_name: smts-test-runner
    profiles: ["test-runner"]
    depends_on:
      artemis-test:
        condition: service_healthy
      corporate-api:
        condition: service_healthy
      dlp-mock:
        condition: service_started
      smts-ext-test:
        condition: service_healthy
      smts-int-test:
        condition: service_healthy
    environment:
      - ARTEMIS_URL=tcp://artemis-test:61613
      - API_BASE_URL=http://corporate-api:8080
      - DLP_ENDPOINT=http://dlp-mock:1080/validate
      - LOG_LEVEL=debug
      - LOG_PATH=/app/logs
    volumes:
      - ./docker-logs/smts-test-runner:/app/logs
    command: >
      sh -c "
        echo 'Waiting for all services to be ready...' &&
        sleep 5 &&
        echo '=== Running Unit Tests ===' &&
        /app/bin/run-unit-tests.sh 2>&1 | tee /app/logs/unit-tests.log &&
        echo '=== Running Integration Tests ===' &&
        /app/bin/run-integration-tests.sh 2>&1 | tee /app/logs/integration-tests.log
      "


volumes:
  artemis-test-data: