version: '3.8'

services:
  # Test NATS server for integration tests
  nats-test:
    image: nats:2.12-alpine
    container_name: smts-nats-test
    ports:
      - "14222:4222"  # EXT test port
      - "14223:4223"  # INT test port
      - "18222:8222"  # Monitoring
    command: >
      -js
      -sd /data
      -m 8222
    volumes:
      - nats-test-data:/data

  # Test Artemis server for INT SMTS tests
  artemis-test:
    container_name: artemis-test
    image: apache/activemq-artemis:2.42.0
    ports:
      - "61613:61613"  # INT test port
      - "18161:8161"   # Web console
    volumes:
      - artemis-test-data:/var/lib/artemis/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8161/console"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Test API server for simulating corporate API
  api-mock:
    image: mockserver/mockserver:mockserver-5.15.0
    container_name: smts-api-mock
    ports:
      - "18080:1080"  # EXT test API
      - "18082:1081"  # INT test API
    environment:
      - MOCKSERVER_LOG_LEVEL=INFO
      - MOCKSERVER_SERVER_PORT=1080
    command: >
      -serverPort 1080
      -serverPort 1081

  # Test DLP service for INT SMTS tests
  dlp-mock:
    image: mockserver/mockserver:mockserver-5.15.0
    container_name: smts-dlp-mock
    ports:
      - "18081:1080"  # DLP validation service
    environment:
      - MOCKSERVER_LOG_LEVEL=INFO
    command: >
      -serverPort 1080

  # SMTS test runner
  smts-test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: test-runner
    container_name: smts-test-runner
    depends_on:
      nats-test:
        condition: service_started
      artemis-test:
        condition: service_healthy
    environment:
      - NATS_URL=nats://nats-test:4222
      - ARTEMIS_URL=tcp://artemis-test:61613
      - API_BASE_URL=http://api-mock:1080
      - DLP_ENDPOINT=http://dlp-mock:1080/validate
      - LOG_LEVEL=debug
      - LOG_PATH=/app/logs
      - LOG_FILE=/app/logs/test-runner.log
    volumes:
      - ./test-results:/app/test-results
      - ./docker-logs/smts-test-runner:/app/logs
      # - ./docker-logs/smts-test-runner:/var/log/app
      # - ./docker-logs/smts-test-runner:/var/log
      # - ./docker-logs/smts-test-runner:/logs
      # - ./docker-logs/smts-test-runner:/tmp/logs
    command: >
      sh -c "
        echo 'Waiting for services to be ready...' &&
        sleep 1 &&
        echo '=== Running Unit Tests ===' &&
        /app/bin/run-unit-tests.sh >> /app/logs/unit-tests.log &&
        echo '=== Running Integration Tests ===' &&
        /app/bin/run-integration-tests.sh >> /app/logs/integration-tests.log
      "

  # EXT SMTS test service
  smts-ext-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: smts-ext-test
    depends_on:
      nats-test:
        condition: service_started
    environment:
      - CONFIG_FILE=/app/tests/configs/ext-test-config.yaml
    command: >
      sh -c "
        /app/bin/ext-smts --config /app/tests/configs/ext-test-config.yaml
      "
    healthcheck:
      test: ["CMD", "/app/bin/ext-smts", "--health-check", "--config", "/app/tests/configs/ext-test-config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 5

  # INT SMTS test service
  smts-int-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: smts-int-test
    depends_on:
      nats-test:
        condition: service_started
      artemis-test:
        condition: service_healthy
    environment:
      - CONFIG_FILE=/app/tests/configs/int-test-config.yaml
    command: >
      sh -c "
        /app/bin/int-smts --config /app/tests/configs/int-test-config.yaml
      "
    healthcheck:
      test: ["CMD", "/app/bin/int-smts", "--health-check", "--config", "/app/tests/configs/int-test-config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nats-test-data:
  artemis-test-data: