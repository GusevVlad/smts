version: '3.8'

services:
  # Internal SMTS Production Service
  smts-int-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smts-int-prod
    restart: unless-stopped
    ports:
      - "4223:4222"  # NATS server port (different port to avoid conflicts)
      # HTTP ports are not exposed externally; accessed via nginx
    env_file:
      - .env.int-prod
    environment:
      - CONFIG_FILE=/app/configs/int-config.yaml
      # Vault credentials must be provided via environment variables at runtime
      - VAULT_ROLE_ID=${INT_VAULT_ROLE_ID}
      - VAULT_SECRET_ID=${INT_VAULT_SECRET_ID}
      # Optional: override VAULT_ADDR if needed
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
    volumes:
      - smts-int-data:/app/data
      - ./configs/int-config.yaml:/app/configs/int-config.yaml:ro
      - ./configs/topics.yaml:/app/configs/topics.yaml:ro
      # Mount secret files for more secure secret injection (optional)
      - type: bind
        source: ./secrets/int-vault-role-id
        target: /run/secrets/vault-role-id
        read_only: true
      - type: bind
        source: ./secrets/int-vault-secret-id
        target: /run/secrets/vault-secret-id
        read_only: true
    command: ["/app/bin/int-smts", "--config", "/app/configs/int-config.yaml"]
    healthcheck:
      test: ["CMD", "/app/bin/int-smts", "--health-check", "--config", "/app/configs/int-config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx reverse proxy for internal SMTS
  nginx-int:
    image: nginx:alpine
    container_name: nginx-int
    restart: unless-stopped
    ports:
      - "8080:80"   # HTTP redirect port (different from external to avoid conflict)
      - "8443:443"  # HTTPS port (different from external)
    volumes:
      - ./nginx/int/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl/int:/etc/nginx/ssl:ro
    depends_on:
      - smts-int-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  smts-int-data:
    driver: local